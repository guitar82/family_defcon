# Family DEFCON Dashboard Package
#
# Copy this file to:
# /config/packages/family_defcon_dashboard.yaml
#
# Then make sure configuration.yaml has:
#
# homeassistant:
#   packages: !include_dir_named packages
#
# This package creates the helpers and scripts needed by the compact launch dashboard.
# It does not overwrite your family_defcon.yaml.

input_text:
  family_defcon_dashboard_pin:
    name: Family DEFCON Dashboard PIN
    mode: password
    max: 12

input_select:
  family_defcon_dashboard_target:
    name: Family DEFCON Dashboard Target
    options:
      - Child 1
      - Child 2
      - Child 3
      - Parent 1
      - Parent 2
    initial: Child 1

input_boolean:
  family_defcon_launch_confirm:
    name: Family DEFCON Launch Confirm
    icon: mdi:rocket-launch

script:
  family_defcon_dashboard_launch:
    alias: Family DEFCON Dashboard Launch
    mode: single
    sequence:
      - condition: template
        value_template: >
          {{ states('input_text.family_defcon_dashboard_pin') | length > 0 }}

      - action: family_defcon.launch_with_pin
        data:
          pin: "{{ states('input_text.family_defcon_dashboard_pin') }}"
          target: "{{ states('input_select.family_defcon_dashboard_target') }}"
          station: dashboard

      - action: input_text.set_value
        target:
          entity_id: input_text.family_defcon_dashboard_pin
        data:
          value: ""

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.family_defcon_launch_confirm

  family_defcon_dashboard_cancel:
    alias: Family DEFCON Dashboard Cancel
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.family_defcon_dashboard_pin
        data:
          value: ""

      - action: input_select.select_option
        target:
          entity_id: input_select.family_defcon_dashboard_target
        data:
          option: Child 1

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.family_defcon_launch_confirm
