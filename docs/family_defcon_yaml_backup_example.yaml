# Family DEFCON example YAML backup
#
# Recommended setup:
# Configure Family DEFCON from the Home Assistant UI.
#
# This file is only an optional backup or advanced configuration example.
# PINs are recommended to be configured from the UI so they are saved as hidden hashes.

people:
  - Parent 1
  - Parent 2
  - Child 1
  - Child 2
  - Child 3

default_targets:
  - Child 1
  - Child 2
  - Child 3

parent_targets:
  - Parent 1
  - Parent 2

allow_parent_targets_default: false

auth:
  mode: pin
  pin_timeout_seconds: 60
  max_bad_pin_attempts: 3
  lockout_seconds_after_bad_pins: 120
  users:
    Parent 1:
      # Configure PIN in the UI.
      # pin: "change-me"
      role: parent
    Parent 2:
      # Configure PIN in the UI.
      # pin: "change-me"
      role: parent
    Child 1:
      # Configure PIN in the UI only if this child should be allowed to launch.
      # pin: "change-me"
      role: child
    Child 2:
      # Configure PIN in the UI only if this child should be allowed to launch.
      # pin: "change-me"
      role: child
    Child 3:
      # Configure PIN in the UI only if this child should be allowed to launch.
      # pin: "change-me"
      role: child

stations:
  dashboard:
    name: Home Assistant Dashboard
    enabled: true
    key_entity: ""

require_station_match: false
require_key_for_launch: false
cooldown_seconds: 30

launches_before_mutual_destruction: 5
chain_before_mutual_destruction: 4
daily_reset_time: "05:00:00"
max_event_log: 25

penalties:
  first_strike_target_minutes: 30
  retaliator_extra_minutes: 15
  retaliation_target_minutes: 30
  reattacker_extra_minutes: 15
  reattack_target_minutes: 45

dns:
  enabled: true
  provider: adguard_home
  enforcement_mode: active
  mutual_destruction_scope: default_targets

  adguard_home:
    base_url: "http://192.168.1.11:3000"
    username_secret: adguard_username
    password_secret: adguard_password
    username: ""
    password: ""
    rule_prefix: "Family DEFCON Block"

    clients:
      Parent 1:
        client_name: Parent 1
        enabled: true
      Parent 2:
        client_name: Parent 2
        enabled: true
      Child 1:
        client_name: Child 1
        enabled: true
      Child 2:
        client_name: Child 2
        enabled: true
      Child 3:
        client_name: Child 3
        enabled: true

dashboard:
  station_id: dashboard
  default_target: Child 1
  targets:
    - Child 1
    - Child 2
    - Child 3
    - Parent 1
    - Parent 2
