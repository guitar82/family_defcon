# Family DEFCON Dynamic Target Button Section
# Required HACS cards:
# - auto-entities
# - button-card
#
# This section works with both old and new generated target entity IDs:
# - button.family_defcon_select_target_*
# - button.select_target_*

type: custom:auto-entities
show_empty: false
card:
  type: grid
  columns: 3
  square: false
card_param: cards
filter:
  include:
    - entity_id: button.family_defcon_select_target_*
      options: &target_button_options
        type: custom:button-card
        entity: this.entity_id
        show_state: false
        name: |
          [[[
            return entity.attributes.display_name || entity.attributes.target || entity.attributes.friendly_name || 'Target';
          ]]]
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: this.entity_id
        triggers_update:
          - select.family_defcon_dashboard_target
        styles:
          card:
            - height: 48px
            - border-radius: 14px
            - background: |
                [[[
                  const selected = states['select.family_defcon_dashboard_target']?.state || '';
                  const target = entity.attributes.target || entity.attributes.display_name || '';
                  const isParent = entity.attributes.is_parent_target === true;
                  if (selected === target && isParent) return 'linear-gradient(135deg, #fdd835, #f9a825)';
                  if (selected === target) return 'linear-gradient(135deg, #29b6f6, #1565c0)';
                  return '#101820';
                ]]]
            - color: |
                [[[
                  const selected = states['select.family_defcon_dashboard_target']?.state || '';
                  const target = entity.attributes.target || entity.attributes.display_name || '';
                  const isParent = entity.attributes.is_parent_target === true;
                  return selected === target && isParent ? '#111111' : '#ffffff';
                ]]]
            - border: 1px solid rgba(255,255,255,.12)
          icon:
            - width: 20px
          name:
            - font-size: 13px
            - font-weight: 950
    - entity_id: button.select_target_*
      options: *target_button_options
  sort:
    method: name
