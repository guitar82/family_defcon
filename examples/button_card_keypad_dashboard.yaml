        - color: "#29b6f6"
        - font-size: 18px
        - font-weight: 900
        - letter-spacing: 1px
      icon:
        - color: "#29b6f6"
        - width: 28px

  - type: custom:button-card
    entity: sensor.family_defcon_dashboard_people
    show_icon: false
    show_name: false
    tap_action:
      action: none
    triggers_update: all
    styles:
      card:
        - border-radius: 18px
        - padding: 14px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(255,255,255,.12)
    custom_fields:
      people: |
        [[[
          const sensor = states['sensor.family_defcon_dashboard_people'];
          const people = sensor?.attributes?.people || [];

          if (!people.length) {
            return `<div style="padding:12px; color:#ffca28;">No people configured.</div>`;
          }

          return people.map((p) => {
            const status = states[p.status_entity]?.state || 'unknown';
            const mins = states[p.minutes_entity]?.state || '0';
            const blocked = status === 'blocked';
            const color = blocked ? '#ef5350' : '#66bb6a';
            const icon = blocked ? '🚫' : '✅';
            const label = blocked ? `PAUSED — ${mins} min` : 'ONLINE';

            let role = 'TARGET';
            if (p.is_parent_target) role = 'PARENT';
            if (p.is_default_target) role = 'CHILD';

            return `
              <div style="display:grid; grid-template-columns:42px 1fr 130px; gap:10px; align-items:center; padding:10px 8px; border-bottom:1px solid rgba(255,255,255,.08);">
                <div style="font-size:24px;">${icon}</div>
                <div>
                  <div style="font-size:16px; font-weight:800;">${p.name}</div>
                  <div style="font-size:11px; opacity:.55; letter-spacing:1px;">${role}</div>
                </div>
                <div style="font-size:14px; font-weight:900; color:${color}; text-align:right;">${label}</div>
              </div>
            `;
          }).join('');
        ]]]

