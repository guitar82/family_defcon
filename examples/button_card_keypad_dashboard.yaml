        styles:
          card:
            - height: 78px
            - border-radius: 16px
            - background: "#101820"
            - color: white
            - border: 1px solid rgba(255,255,255,.12)
          name:
            - font-size: 13px
            - color: "#b0bec5"
        custom_fields:
          pin: |
            [[[
              const pin = states['text.family_defcon_dashboard_pin']?.state || '';
              const masked = pin.length ? '●'.repeat(pin.length) : 'ENTER PIN';
              return `<div style="font-size:26px; font-weight:900; letter-spacing:4px; color:#ffffff;">${masked}</div>`;
            ]]]

      - type: entities
        title: Select Target
        show_header_toggle: false
        entities:
          - entity: select.family_defcon_dashboard_target
            name: Target

