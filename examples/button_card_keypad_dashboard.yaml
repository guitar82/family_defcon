type: vertical-stack
cards:
  - type: custom:button-card
    entity: sensor.family_defcon_level
    name: FAMILY DEFCON
    show_state: false
    show_icon: false
    tap_action:
      action: none
    triggers_update: all
    styles:
      card:
        - padding: 22px
        - border-radius: 22px
        - background: |
            [[[
              const level = Number(states['sensor.family_defcon_level']?.state || 5);
              if (level <= 1) return 'linear-gradient(135deg, #3b0000, #8b0000)';
              if (level <= 2) return 'linear-gradient(135deg, #4a0000, #b71c1c)';
              if (level === 3) return 'linear-gradient(135deg, #5a2800, #ef6c00)';
              if (level === 4) return 'linear-gradient(135deg, #5c4700, #f9a825)';
              return 'linear-gradient(135deg, #003b12, #1b5e20)';
            ]]]
        - color: white
        - box-shadow: 0 4px 18px rgba(0,0,0,.35)
    custom_fields:
      main: |
        [[[
          const level = Number(states['sensor.family_defcon_level']?.state || 5);
          const peace = states['sensor.family_defcon_peace_status']?.state || 'Unknown';
          const event = states['sensor.family_defcon_last_event']?.state || 'System initialized.';

          let icon = '🟢';
          let label = 'PEACEFUL STATUS';
          let accent = '#9cff9c';

          if (level <= 1) {
            icon = '☢️';
            label = 'MUTUAL WIFI DESTRUCTION';
            accent = '#ffb3b3';
          } else if (level <= 2) {
            icon = '🚨';
            label = 'RED ALERT';
            accent = '#ffcccc';
          } else if (level === 3) {
            icon = '⚠️';
            label = 'ESCALATION';
            accent = '#ffe0b2';
          } else if (level === 4) {
            icon = '🟡';
            label = 'WATCH CONDITION';
            accent = '#fff59d';
          }

          return `
            <div style="display:grid; grid-template-columns: 90px 1fr; gap:18px; align-items:center;">
              <div style="font-size:64px; text-align:center;">${icon}</div>
              <div>
                <div style="font-size:42px; font-weight:900; letter-spacing:2px;">DEFCON ${level}</div>
                <div style="font-size:18px; font-weight:800; color:${accent};">${label}</div>
                <div style="font-size:13px; margin-top:10px; opacity:.9;">Peace Status: <b>${peace}</b></div>
                <div style="font-size:13px; margin-top:6px; opacity:.85;">Last Event: ${event}</div>
              </div>
            </div>
          `;
        ]]]

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.family_defcon_level
        name: DEFCON LEVEL
        icon: mdi:gauge
        show_state: true
        styles:
          card:
            - border-radius: 16px
            - padding: 14px
            - background: "#101820"
            - color: white
          icon:
            - color: "#42a5f5"
          state:
            - font-size: 22px
            - font-weight: 900
          name:
            - font-size: 12px
            - color: "#b0bec5"

      - type: custom:button-card
        entity: switch.family_defcon_command_system_armed
        name: SYSTEM ARMED
        icon: mdi:shield-lock
        show_state: true
        tap_action:
          action: toggle
        styles:
          card:
            - border-radius: 16px
            - padding: 14px
            - background: "#101820"
            - color: white
          icon:
            - color: |
                [[[
                  return entity.state === 'on' ? '#4caf50' : '#b0bec5';
                ]]]
          state:
            - font-size: 22px
            - font-weight: 900
            - color: |
                [[[
                  return entity.state === 'on' ? '#4caf50' : '#b0bec5';
                ]]]
          name:
            - font-size: 12px
            - color: "#b0bec5"

      - type: custom:button-card
        entity: sensor.family_defcon_daily_launches
        name: DAILY LAUNCHES
        icon: mdi:target
        show_state: true
        styles:
          card:
            - border-radius: 16px
            - padding: 14px
            - background: "#101820"
            - color: white
          icon:
            - color: "#ffca28"
          state:
            - font-size: 22px
            - font-weight: 900
          name:
            - font-size: 12px
            - color: "#b0bec5"

      - type: custom:button-card
        entity: sensor.family_defcon_conflict_chain
        name: CONFLICT CHAIN
        icon: mdi:link-variant
        show_state: true
        styles:
