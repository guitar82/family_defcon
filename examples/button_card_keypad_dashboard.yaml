type: vertical-stack
cards:
  - type: custom:button-card
    entity: sensor.family_defcon_level
    name: FAMILY DEFCON
    show_state: false
    show_icon: false
    tap_action:
      action: none
    triggers_update: all
    styles:
      card:
        - padding: 22px
        - border-radius: 24px
        - border: 1px solid rgba(255,255,255,.16)
        - box-shadow: 0 8px 24px rgba(0,0,0,.35)
        - background: |
            [[[
              const level = Number(states['sensor.family_defcon_level']?.state || 5);
              if (level <= 1) return 'radial-gradient(circle at top left, #ff5252 0%, #3b0000 48%, #090909 100%)';
              if (level <= 2) return 'radial-gradient(circle at top left, #ff7043 0%, #7f0000 48%, #090909 100%)';
              if (level === 3) return 'radial-gradient(circle at top left, #ffb74d 0%, #6d3300 48%, #090909 100%)';
              if (level === 4) return 'radial-gradient(circle at top left, #fff176 0%, #6a5600 48%, #090909 100%)';
              return 'radial-gradient(circle at top left, #69f0ae 0%, #0b4d22 48%, #090909 100%)';
            ]]]
        - color: white
    custom_fields:
      main: |
        [[[
          const level = Number(states['sensor.family_defcon_level']?.state || 5);
          const peace = states['sensor.family_defcon_peace_status']?.state || 'Unknown';
          const event = states['sensor.family_defcon_last_event']?.state || 'System initialized.';
          const armed = states['switch.family_defcon_command_system_armed']?.state === 'on';

          let icon = '🟢';
          let label = 'PEACEFUL STATUS';
          let accent = '#69f0ae';

          if (level <= 1) { icon = '☢️'; label = 'MUTUAL WIFI DESTRUCTION'; accent = '#ff8a80'; }
          else if (level <= 2) { icon = '🚨'; label = 'RED ALERT'; accent = '#ffab91'; }
          else if (level === 3) { icon = '⚠️'; label = 'ESCALATION'; accent = '#ffd180'; }
          else if (level === 4) { icon = '🟡'; label = 'WATCH CONDITION'; accent = '#fff59d'; }

          return `
            <div style="display:grid; grid-template-columns:86px minmax(0,1fr); gap:18px; align-items:center;">
              <div style="font-size:62px; text-align:center;">${icon}</div>
              <div style="min-width:0;">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
                  <div style="font-size:40px; font-weight:950; letter-spacing:2px;">DEFCON ${level}</div>
                  <div style="font-size:12px; font-weight:900; padding:6px 10px; border-radius:999px; background:${armed ? 'rgba(105,240,174,.16)' : 'rgba(255,255,255,.12)'}; color:${armed ? '#69f0ae' : '#cfd8dc'};">
                    ${armed ? 'ARMED' : 'DISARMED'}
                  </div>
                </div>
                <div style="font-size:18px; font-weight:900; color:${accent}; letter-spacing:1px;">${label}</div>
                <div style="font-size:13px; margin-top:10px; opacity:.9;">Peace Status: <b>${peace}</b></div>
                <div style="font-size:13px; margin-top:6px; opacity:.82; white-space:normal; overflow:visible; line-height:1.35; max-width:100%; word-break:normal;">
                  ${event}
                </div>
              </div>
            </div>
          `;
        ]]]

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.family_defcon_level
        name: DEFCON
        icon: mdi:gauge
        show_state: true
        styles: &status_tile
          card:
            - border-radius: 18px
            - padding: 14px
            - background: "#101820"
            - color: white
            - border: 1px solid rgba(255,255,255,.10)
          icon:
            - color: "#42a5f5"
          state:
            - font-size: 24px
            - font-weight: 950
          name:
            - font-size: 12px
            - color: "#b0bec5"
            - font-weight: 800

      - type: custom:button-card
        entity: switch.family_defcon_command_system_armed
        name: ARMED
        icon: mdi:shield-lock
        show_state: true
        tap_action:
          action: toggle
        styles:
          <<: *status_tile
          icon:
            - color: |
                [[[
                  return entity.state === 'on' ? '#69f0ae' : '#b0bec5';
                ]]]
          state:
            - font-size: 24px
            - font-weight: 950
            - color: |
                [[[
                  return entity.state === 'on' ? '#69f0ae' : '#b0bec5';
                ]]]

      - type: custom:button-card
        entity: sensor.family_defcon_daily_launches
        name: LAUNCHES
        icon: mdi:target
        show_state: true
        styles:
          <<: *status_tile
          icon:
            - color: "#ffca28"

      - type: custom:button-card
        entity: sensor.family_defcon_conflict_chain
        name: CHAIN
        icon: mdi:link-variant
        show_state: true
        styles:
          <<: *status_tile
          icon:
            - color: "#ef5350"

  - type: custom:button-card
    name: LAUNCH COMMAND INTERFACE
    icon: mdi:rocket-launch
    show_icon: true
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 20px
        - padding: 16px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(41,182,246,.38)
      name:
        - justify-self: start
        - color: "#29b6f6"
        - font-size: 18px
        - font-weight: 950
        - letter-spacing: 1px
      icon:
        - color: "#29b6f6"
        - width: 28px

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: text.dashboard_pin
        name: PIN
        show_icon: false
        show_state: false
        triggers_update: all
        tap_action:
          action: none
        styles:
          grid:
            - grid-template-areas: '"n" "pin"'
            - grid-template-rows: min-content 1fr
            - grid-template-columns: 1fr
          card:
            - height: 96px
            - border-radius: 18px
            - background: "#101820"
            - color: white
            - border: 1px solid rgba(255,255,255,.12)
            - padding: 12px
            - overflow: visible
          name:
            - font-size: 12px
            - color: "#b0bec5"
            - font-weight: 900
            - letter-spacing: 1px
            - justify-self: center
            - line-height: 1.1
            - padding-bottom: 6px
          custom_fields:
            pin:
              - justify-self: center
              - align-self: center
        custom_fields:
          pin: |
            [[[
              const pin = states['text.dashboard_pin']?.state || '';
              const masked = pin.length ? '●'.repeat(pin.length) : 'ENTER PIN';
              return `<div style="font-size:${pin.length ? '30px' : '20px'}; font-weight:950; letter-spacing:${pin.length ? '7px' : '1px'}; color:#ffffff; line-height:1.2; white-space:nowrap;">${masked}</div>`;
            ]]]

      - type: custom:button-card
        entity: select.dashboard_target
        name: CURRENT TARGET
        icon: mdi:account-crosshairs
        show_state: true
        tap_action:
          action: none
        styles:
          card:
            - height: 96px
            - border-radius: 18px
            - background: "linear-gradient(135deg, #082032, #101820)"
            - color: white
            - border: 1px solid rgba(41,182,246,.50)
            - padding: 12px
            - box-shadow: 0 0 14px rgba(41,182,246,.16)
          icon:
            - color: "#29b6f6"
            - width: 30px
          name:
            - font-size: 12px
            - color: "#b0bec5"
            - font-weight: 900
            - letter-spacing: 1px
          state:
            - font-size: 26px
            - font-weight: 950
            - color: "#ffffff"

  - type: custom:button-card
    name: SELECT TARGET
    icon: mdi:crosshairs-gps
    show_icon: true
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 20px
        - padding: 14px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(41,182,246,.38)
      name:
        - justify-self: start
        - color: "#29b6f6"
        - font-size: 16px
        - font-weight: 950
        - letter-spacing: 1px
      icon:
        - color: "#29b6f6"
        - width: 24px

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        name: Henry
        icon: mdi:account
        tap_action: &target_henry
          action: call-service
          service: family_defcon.dashboard_select_target
          data:
            target: Henry
        styles: &target_kid_style
          card:
            - height: 62px
            - border-radius: 16px
            - background: |
                [[[
                  return states['select.dashboard_target']?.state === this._config.name
                    ? 'linear-gradient(135deg, #29b6f6, #1565c0)'
                    : '#101820';
                ]]]
            - color: white
            - border: |
                [[[
                  return states['select.dashboard_target']?.state === this._config.name
                    ? '1px solid rgba(41,182,246,.9)'
                    : '1px solid rgba(255,255,255,.12)';
                ]]]
            - box-shadow: |
                [[[
                  return states['select.dashboard_target']?.state === this._config.name
                    ? '0 0 16px rgba(41,182,246,.45)'
                    : 'none';
                ]]]
          icon:
            - width: 24px
            - color: white
          name:
            - font-size: 15px
            - font-weight: 950

      - type: custom:button-card
        name: Marc
        icon: mdi:account
        tap_action:
          action: call-service
          service: family_defcon.dashboard_select_target
          data:
            target: Marc
        styles: *target_kid_style

      - type: custom:button-card
        name: Maggie
        icon: mdi:account
        tap_action:
          action: call-service
          service: family_defcon.dashboard_select_target
          data:
            target: Maggie
        styles: *target_kid_style

      - type: custom:button-card
        name: Mom
        icon: mdi:account-supervisor
        tap_action:
          action: call-service
          service: family_defcon.dashboard_select_target
          data:
            target: Mom
        styles: &target_parent_style
          card:
            - height: 62px
            - border-radius: 16px
            - background: |
                [[[
                  return states['select.dashboard_target']?.state === this._config.name
                    ? 'linear-gradient(135deg, #fdd835, #f9a825)'
                    : '#101820';
                ]]]
            - color: |
                [[[
                  return states['select.dashboard_target']?.state === this._config.name
                    ? '#111111'
                    : '#ffffff';
                ]]]
            - border: |
                [[[
                  return states['select.dashboard_target']?.state === this._config.name
                    ? '1px solid rgba(253,216,53,.9)'
                    : '1px solid rgba(255,255,255,.12)';
                ]]]
            - box-shadow: |
                [[[
                  return states['select.dashboard_target']?.state === this._config.name
                    ? '0 0 16px rgba(253,216,53,.45)'
                    : 'none';
                ]]]
          icon:
            - width: 24px
          name:
            - font-size: 15px
            - font-weight: 950

      - type: custom:button-card
        name: Dad
        icon: mdi:account-supervisor
        tap_action:
          action: call-service
          service: family_defcon.dashboard_select_target
          data:
            target: Dad
        styles: *target_parent_style

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        name: "1"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "1"
        styles: &keypad_style
          card:
            - height: 58px
            - border-radius: 16px
            - background: "#101820"
            - color: white
            - font-weight: 950
            - border: 1px solid rgba(255,255,255,.12)
          name:
            - font-size: 23px
            - font-weight: 950

      - type: custom:button-card
        name: "2"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "2"
        styles: *keypad_style

      - type: custom:button-card
        name: "3"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "3"
        styles: *keypad_style

      - type: custom:button-card
        name: "4"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "4"
        styles: *keypad_style

      - type: custom:button-card
        name: "5"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "5"
        styles: *keypad_style

      - type: custom:button-card
        name: "6"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "6"
        styles: *keypad_style

      - type: custom:button-card
        name: "7"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "7"
        styles: *keypad_style

      - type: custom:button-card
        name: "8"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "8"
        styles: *keypad_style

      - type: custom:button-card
        name: "9"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "9"
        styles: *keypad_style

      - type: custom:button-card
        name: CLEAR
        tap_action:
          action: call-service
          service: family_defcon.dashboard_clear_pin
        styles:
          card:
            - height: 58px
            - border-radius: 16px
            - background: "#263238"
            - color: white
            - font-weight: 950
            - border: 1px solid rgba(255,255,255,.12)
          name:
            - font-size: 16px
            - font-weight: 950

      - type: custom:button-card
        name: "0"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "0"
        styles: *keypad_style

      - type: custom:button-card
        name: BACK
        tap_action:
          action: call-service
          service: family_defcon.dashboard_backspace
        styles:
          card:
            - height: 58px
            - border-radius: 16px
            - background: "#263238"
            - color: white
            - font-weight: 950
            - border: 1px solid rgba(255,255,255,.12)
          name:
            - font-size: 16px
            - font-weight: 950

  - type: custom:button-card
    entity: select.dashboard_target
    name: TARGETING STATUS
    show_icon: false
    show_state: false
    triggers_update: all
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 18px
        - padding: 14px
        - background: |
            [[[
              const pin = states['text.dashboard_pin']?.state || '';
              const confirmed =
                states['binary_sensor.dashboard_target_confirmed']?.state === 'on' ||
                states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';

              if (confirmed) return 'linear-gradient(135deg, #003b12, #69f0ae)';
              if (pin.length > 0) return 'linear-gradient(135deg, #4a3b00, #fdd835)';
              return '#101820';
            ]]]
        - color: |
            [[[
              const pin = states['text.dashboard_pin']?.state || '';
              const confirmed =
                states['binary_sensor.dashboard_target_confirmed']?.state === 'on' ||
                states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';

              return confirmed || pin.length > 0 ? '#111111' : '#ffffff';
            ]]]
        - border: 1px solid rgba(255,255,255,.12)
        - box-shadow: |
            [[[
              const confirmed =
                states['binary_sensor.dashboard_target_confirmed']?.state === 'on' ||
                states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';

              return confirmed ? '0 0 20px rgba(105,240,174,.45)' : 'none';
            ]]]
    custom_fields:
      status: |
        [[[
          const pin = states['text.dashboard_pin']?.state || '';
          const target = states['select.dashboard_target']?.state || 'No target';
          const confirmed =
            states['binary_sensor.dashboard_target_confirmed']?.state === 'on' ||
            states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';

          if (confirmed) {
            return `
              <div style="text-align:center;">
                <div style="font-size:13px; font-weight:950; letter-spacing:1px;">✅ TARGET LOCKED</div>
                <div style="font-size:26px; font-weight:950; margin-top:4px;">${target}</div>
                <div style="font-size:12px; margin-top:4px;">Confirmation received. Press LAUNCH or CANCEL.</div>
              </div>
            `;
          }

          if (pin.length > 0) {
            return `
              <div style="text-align:center;">
                <div style="font-size:13px; font-weight:900; letter-spacing:1px;">TARGET READY</div>
                <div style="font-size:25px; font-weight:950; margin-top:4px;">${target}</div>
                <div style="font-size:12px; margin-top:4px;">PIN entered. Press CONFIRM to lock target.</div>
              </div>
            `;
          }

          return `
            <div style="text-align:center;">
              <div style="font-size:13px; font-weight:900; letter-spacing:1px; color:#b0bec5;">AWAITING PIN</div>
              <div style="font-size:22px; font-weight:950; margin-top:4px;">Select target and enter PIN</div>
            </div>
          `;
        ]]]

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        entity: button.dashboard_confirm_targeting
        name: CONFIRM
        icon: mdi:target
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.dashboard_confirm_targeting
        styles:
          card:
            - height: 74px
            - border-radius: 18px
            - background: |
                [[[
                  const confirmed =
                    states['binary_sensor.dashboard_target_confirmed']?.state === 'on' ||
                    states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
                  const pin = states['text.dashboard_pin']?.state || '';
                  if (confirmed) return 'linear-gradient(135deg, #003b12, #69f0ae)';
                  return pin.length > 0
                    ? 'linear-gradient(135deg, #fdd835, #fff176)'
                    : '#5f5100';
                ]]]
            - color: "#111"
            - font-weight: 950
            - box-shadow: |
                [[[
                  const confirmed =
                    states['binary_sensor.dashboard_target_confirmed']?.state === 'on' ||
                    states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
                  const pin = states['text.dashboard_pin']?.state || '';
                  if (confirmed) return '0 0 18px rgba(105,240,174,.55)';
                  return pin.length > 0
                    ? '0 0 18px rgba(253,216,53,.55)'
                    : 'none';
                ]]]
          icon:
            - color: "#111"
            - width: 30px
          name:
            - font-size: 16px
            - letter-spacing: 1px

      - type: custom:button-card
        entity: button.dashboard_launch
        name: LAUNCH
        icon: mdi:rocket-launch
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.dashboard_launch
        styles:
          card:
            - height: 74px
            - border-radius: 18px
            - background: "linear-gradient(135deg, #b71c1c, #f44336)"
            - color: white
            - font-weight: 950
            - letter-spacing: 1px
            - box-shadow: 0 4px 14px rgba(244,67,54,.35)
          icon:
            - width: 30px
          name:
            - font-size: 16px

      - type: custom:button-card
        entity: button.dashboard_cancel
        name: CANCEL
        icon: mdi:cancel
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.dashboard_cancel
        styles:
          card:
            - height: 74px
            - border-radius: 18px
            - background: "#263238"
            - color: white
            - font-weight: 950
            - letter-spacing: 1px
          icon:
            - width: 30px
            - color: "#cfd8dc"
          name:
            - font-size: 16px

  - type: custom:button-card
    name: CURRENT WIFI STATUS
    icon: mdi:wifi
    show_icon: true
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 20px
        - padding: 16px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(41,182,246,.38)
      name:
        - justify-self: start
        - color: "#29b6f6"
        - font-size: 18px
        - font-weight: 950
        - letter-spacing: 1px
      icon:
        - color: "#29b6f6"
        - width: 28px

  - type: custom:button-card
    entity: sensor.dashboard_people
    show_icon: false
    show_name: false
    tap_action:
      action: none
    triggers_update: all
    styles:
      card:
        - border-radius: 20px
        - padding: 14px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(255,255,255,.12)
    custom_fields:
      people: |
        [[[
          const peopleSensor = states['sensor.dashboard_people'];
          const people = peopleSensor?.attributes?.people || [];

          if (!people.length) {
            return `
              <div style="padding:14px; color:#ffca28; font-size:16px; text-align:center;">
                No people configured.
                <br>
                <span style="font-size:12px; opacity:.65;">
                  sensor.dashboard_people does not have a people attribute.
                </span>
              </div>
            `;
          }

          return people.map((p) => {
            const status = states[p.status_entity]?.state || 'unknown';
            const mins = states[p.minutes_entity]?.state || '0';
            const blocked = status === 'blocked';
            const color = blocked ? '#ef5350' : '#66bb6a';
            const icon = blocked ? '🚫' : '✅';
            const label = blocked ? `PAUSED — ${mins} min` : 'ONLINE';

            let role = 'TARGET';
            if (p.is_parent_target) role = 'PARENT';
            if (p.is_default_target) role = 'CHILD';

            return `
              <div style="
                display:grid;
                grid-template-columns:42px minmax(0,1fr) 135px;
                gap:10px;
                align-items:center;
                padding:11px 8px;
                border-bottom:1px solid rgba(255,255,255,.08);
              ">
                <div style="font-size:24px;">${icon}</div>
                <div style="min-width:0;">
                  <div style="
                    font-size:17px;
                    font-weight:900;
                    white-space:normal;
                    overflow:visible;
                  ">${p.name}</div>
                  <div style="font-size:11px; opacity:.55; letter-spacing:1px;">${role}</div>
                </div>
                <div style="
                  font-size:14px;
                  font-weight:950;
                  color:${color};
                  text-align:right;
                  white-space:normal;
                ">${label}</div>
              </div>
            `;
          }).join('');
        ]]]

  - type: grid
    title: Parent Controls
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        name: ARM
        icon: mdi:shield-lock
        tap_action:
          action: call-service
          service: family_defcon.set_armed
          data:
            enabled: true
        styles:
          card:
            - border-radius: 16px
            - background: "#103d1b"
            - color: "#66ff66"
            - height: 76px
            - font-weight: 950

      - type: custom:button-card
        name: DISARM
        icon: mdi:shield-off
        tap_action:
          action: call-service
          service: family_defcon.set_armed
          data:
            enabled: false
        styles:
