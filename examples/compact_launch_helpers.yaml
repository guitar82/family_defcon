# Optional dashboard helpers for the compact launch interface.
# Add these to configuration.yaml, or create equivalent helpers through the UI.

input_text:
  family_defcon_dashboard_pin:
    name: Family DEFCON Dashboard PIN
    mode: password
    max: 12

input_select:
  family_defcon_dashboard_target:
    name: Family DEFCON Dashboard Target
    options:
      - Child 1
      - Child 2
      - Child 3
      - Parent 1
      - Parent 2
    initial: Child 1

input_boolean:
  family_defcon_launch_confirm:
    name: Family DEFCON Launch Confirm
    icon: mdi:rocket-launch
