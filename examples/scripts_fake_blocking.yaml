# Add this to scripts.yaml for safe testing. These only toggle helpers.
block_henry_internet:
  alias: Block Henry Internet
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.internet_block_henry
unblock_henry_internet:
  alias: Unblock Henry Internet
  mode: single
  sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.internet_block_henry
block_marc_internet:
