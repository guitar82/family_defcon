type: vertical-stack
cards:
  - type: markdown
    content: >
      {% set level = states('sensor.family_defcon_level') | int(5) %}
      {% set event = states('sensor.family_defcon_last_event') %}
      {% if level <= 2 %}
        {% set bg = '#b71c1c' %}
        {% set fg = '#ffffff' %}
        {% set label = 'RED ALERT' %}
        {% set icon = '🚨' %}
      {% elif level == 3 %}
        {% set bg = '#ef6c00' %}
        {% set fg = '#ffffff' %}
        {% set label = 'YELLOW ALERT' %}
        {% set icon = '⚠️' %}
      {% elif level == 4 %}
        {% set bg = '#f9a825' %}
        {% set fg = '#111111' %}
        {% set label = 'WATCH' %}
        {% set icon = '🟡' %}
      {% else %}
        {% set bg = '#1b5e20' %}
        {% set fg = '#ffffff' %}
        {% set label = 'GREEN STATUS' %}
        {% set icon = '🟢' %}
      {% endif %}
      <div style="background: {{ bg }}; color: {{ fg }}; padding: 14px; border-radius: 14px; text-align: center;">
        <div style="font-size: 32px;">{{ icon }}</div>
        <div style="font-size: 24px; font-weight: 900;">DEFCON {{ level }} — {{ label }}</div>
        <div style="font-size: 13px; margin-top: 6px;">{{ event }}</div>
      </div>

  - type: gauge
    entity: sensor.family_defcon_level
    name: DEFCON Level
    min: 1
    max: 5
    needle: true
    severity:
      red: 1
      yellow: 3
      green: 4

  - type: entities
    title: Targeting Console
    show_header_toggle: false
    entities:
      - entity: text.family_defcon_dashboard_pin
        name: PIN
      - entity: select.family_defcon_dashboard_target
        name: Target
      - entity: button.family_defcon_dashboard_confirm_targeting
        name: Confirm Targeting

  - type: markdown
    content: >
      ## Final Command

      Selected target: **{{ states('select.family_defcon_dashboard_target') }}**

      Press **Launch** to submit, or **Cancel** to clear.

  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        entity: button.family_defcon_dashboard_launch
        name: LAUNCH
        icon: mdi:rocket-launch
        tap_action:
          action: toggle
      - type: button
        entity: button.family_defcon_dashboard_cancel
        name: CANCEL
        icon: mdi:cancel
        tap_action:
          action: toggle

  - type: markdown
    content: >
      {% set people = [
        ('Parent 1', 'sensor.parent_1_wifi_status', 'sensor.parent_1_wifi_minutes_remaining'),
        ('Parent 2', 'sensor.parent_2_wifi_status', 'sensor.parent_2_wifi_minutes_remaining'),
        ('Child 1', 'sensor.child_1_wifi_status', 'sensor.child_1_wifi_minutes_remaining'),
        ('Child 2', 'sensor.child_2_wifi_status', 'sensor.child_2_wifi_minutes_remaining'),
        ('Child 3', 'sensor.child_3_wifi_status', 'sensor.child_3_wifi_minutes_remaining')
      ] %}
      ## WiFi Status
      {% for name, status_entity, min_entity in people %}
        {% set status = states(status_entity) %}
        {% set mins = states(min_entity) %}
        {% if status == 'blocked' %}
          🚫 **{{ name }}:** PAUSED — {{ mins }} min
        {% else %}
          ✅ **{{ name }}:** ONLINE
        {% endif %}
        <br>
      {% endfor %}

  - type: grid
    title: Parent Controls
    columns: 2
    square: false
    cards:
      - type: button
        name: Arm
        icon: mdi:shield-lock
        tap_action:
          action: call-service
          service: family_defcon.set_armed
          data:
            enabled: true
      - type: button
        name: Disarm
        icon: mdi:shield-off
        tap_action:
          action: call-service
          service: family_defcon.set_armed
          data:
            enabled: false
      - type: button
        name: Clear All
        icon: mdi:restart
        tap_action:
          action: call-service
          service: family_defcon.clear_all
      - type: button
        name: Enforce
        icon: mdi:shield-sync
        tap_action:
          action: call-service
          service: family_defcon.enforce_now
