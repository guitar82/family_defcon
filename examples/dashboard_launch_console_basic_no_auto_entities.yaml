# Family DEFCON Basic Launch Console
# Does not require auto-entities.
# Requires button-card only. Uses the select dropdown instead of dynamic target buttons.

type: vertical-stack
cards:
  - type: custom:button-card
    name: LAUNCH COMMAND INTERFACE
    icon: mdi:rocket-launch
    show_icon: true
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 18px
        - padding: 12px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(41,182,246,.38)

  - type: entities
    entities:
      - entity: select.family_defcon_dashboard_target
        name: Target
      - entity: text.family_defcon_dashboard_pin
        name: PIN

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        entity: button.family_defcon_dashboard_confirm_targeting
        name: CONFIRM
        icon: mdi:target
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.family_defcon_dashboard_confirm_targeting
      - type: custom:button-card
        entity: button.family_defcon_dashboard_launch
        name: LAUNCH
        icon: mdi:rocket-launch
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.family_defcon_dashboard_launch
      - type: custom:button-card
        entity: button.family_defcon_dashboard_cancel
        name: CANCEL
        icon: mdi:cancel
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.family_defcon_dashboard_cancel

  - type: entity
    entity: sensor.family_defcon_last_event
    name: Last Event
