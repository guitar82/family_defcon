# Optional scripts for the compact launch dashboard.
# Add these to scripts.yaml, or recreate them through the Home Assistant UI.

family_defcon_dashboard_launch:
  alias: Family DEFCON Dashboard Launch
  mode: single
  sequence:
    - condition: template
      value_template: >
        {{ states('input_text.family_defcon_dashboard_pin') | length > 0 }}

    - action: family_defcon.launch_with_pin
      data:
        pin: "{{ states('input_text.family_defcon_dashboard_pin') }}"
        target: "{{ states('input_select.family_defcon_dashboard_target') }}"
        station: dashboard

    - action: input_text.set_value
      target:
        entity_id: input_text.family_defcon_dashboard_pin
      data:
        value: ""

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.family_defcon_launch_confirm

family_defcon_dashboard_cancel:
  alias: Family DEFCON Dashboard Cancel
  mode: single
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.family_defcon_dashboard_pin
      data:
        value: ""

    - action: input_select.select_option
      target:
        entity_id: input_select.family_defcon_dashboard_target
      data:
        option: Child 1

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.family_defcon_launch_confirm
