type: vertical-stack
cards:
  - type: markdown
    content: >
      # Family DEFCON

      **DEFCON {{ states('sensor.family_defcon_level') }}**

      Peace Status: **{{ states('sensor.family_defcon_peace_status') }}**

      Last Event: {{ states('sensor.family_defcon_last_event') }}

  - type: entities
    title: Command Controls
    entities:
      - switch.family_defcon_command_system_armed
      - switch.family_defcon_allow_parent_1_and_parent_2_targets
      - binary_sensor.family_defcon_mutual_wifi_destruction
      - sensor.family_defcon_daily_launches
      - sensor.family_defcon_conflict_chain
      - sensor.family_defcon_last_launcher
      - sensor.family_defcon_last_target

  - type: entities
    title: Family WiFi Status
    entities:
      - sensor.parent_1_wifi_status
      - sensor.parent_1_wifi_minutes_remaining
      - sensor.parent_2_wifi_status
      - sensor.parent_2_wifi_minutes_remaining
      - sensor.child_1_wifi_status
      - sensor.child_1_wifi_minutes_remaining
      - sensor.child_2_wifi_status
      - sensor.child_2_wifi_minutes_remaining
      - sensor.child_3_wifi_status
      - sensor.child_3_wifi_minutes_remaining

  - type: grid
    title: Parent Controls
    columns: 2
    square: false
    cards:
      - type: button
        name: Clear All
        icon: mdi:restart
        tap_action:
          action: call-service
          service: family_defcon.clear_all
      - type: button
        name: Enforce Now
        icon: mdi:shield-sync
        tap_action:
          action: call-service
          service: family_defcon.enforce_now
