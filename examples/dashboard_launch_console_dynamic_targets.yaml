# Requires the HACS custom card: auto-entities
# This dashboard does not hard code family member names.
# It shows one target button for each configured dashboard target.
#
# Dynamic button entities are created by Family DEFCON:
# button.family_defcon_select_target_<target_name>

type: vertical-stack
cards:
  - type: custom:button-card
    name: LAUNCH COMMAND INTERFACE
    icon: mdi:rocket-launch
    show_icon: true
    show_name: true
    tap_action:
      action: none
    triggers_update:
      - sensor.family_defcon_last_event
      - binary_sensor.family_defcon_dashboard_target_confirmed
      - select.family_defcon_dashboard_target
      - text.family_defcon_dashboard_pin
    styles:
      grid:
        - grid-template-areas: '"i n" "i sub"'
        - grid-template-columns: 30px 1fr
        - grid-template-rows: min-content min-content
      card:
        - border-radius: 18px
        - padding: 8px 12px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(41,182,246,.38)
        - min-height: 52px
      icon:
        - color: "#29b6f6"
        - width: 22px
      name:
        - justify-self: start
        - color: "#29b6f6"
        - font-size: 14px
        - font-weight: 900
      custom_fields:
        sub:
          - justify-self: start
          - font-size: 11px
          - color: "#b0bec5"
          - white-space: normal
    custom_fields:
      sub: |
        [[[
          const event = states['sensor.family_defcon_last_event']?.state || 'Enter PIN, confirm target, then launch.';
          const confirmed = states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
          const lower = event.toLowerCase();

          if (confirmed) return `<span style="color:#69f0ae;">${event}</span>`;
          if (lower.includes('invalid pin') || lower.includes('bad pin') || lower.includes('locked') || lower.includes('rejected')) return `<span style="color:#ff8a80;">${event}</span>`;
          if (lower.includes('launch sent')) return `<span style="color:#fff176;">${event}</span>`;
          return `<span>${event}</span>`;
        ]]]

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: text.family_defcon_dashboard_pin
        name: PIN
        show_icon: false
        show_state: false
        triggers_update: all
        tap_action:
          action: none
        styles:
          grid:
            - grid-template-areas: '"n" "pin"'
            - grid-template-rows: min-content 1fr
            - grid-template-columns: 1fr
          card:
            - height: 78px
            - border-radius: 18px
            - background: "#101820"
            - color: white
            - border: 1px solid rgba(255,255,255,.12)
            - padding: 10px
          name:
            - font-size: 12px
            - color: "#b0bec5"
            - font-weight: 900
            - justify-self: center
          custom_fields:
            pin:
              - justify-self: center
              - align-self: center
        custom_fields:
          pin: |
            [[[
              const pin = states['text.family_defcon_dashboard_pin']?.state || '';
              const length = Math.min(pin.length, 4);
              const masked = length ? '●'.repeat(length) : 'ENTER PIN';
              return `<div style="text-align:center;"><div style="font-size:${length ? '26px' : '18px'}; font-weight:950; letter-spacing:${length ? '7px' : '1px'}; color:#ffffff; white-space:nowrap;">${masked}</div><div style="font-size:10px; color:#90a4ae; margin-top:2px; letter-spacing:1px;">4 DIGIT MAX</div></div>`;
            ]]]

      - type: custom:button-card
        entity: select.family_defcon_dashboard_target
        name: ""
        icon: mdi:account-crosshairs
        show_state: true
        tap_action:
          action: none
        triggers_update: all
        styles:
          grid:
            - grid-template-areas: '"i s"'
            - grid-template-columns: 34px 1fr
          card:
            - height: 78px
            - border-radius: 18px
            - background: "linear-gradient(135deg, #082032, #101820)"
            - color: white
            - border: 1px solid rgba(41,182,246,.50)
            - padding: 10px
            - box-shadow: 0 0 14px rgba(41,182,246,.16)
          icon:
            - color: "#29b6f6"
            - width: 26px
          name:
            - display: none
          state:
            - font-size: 30px
            - font-weight: 950
            - color: "#ffffff"
            - justify-self: start

  - type: custom:button-card
    entity: select.family_defcon_dashboard_target
    name: ""
    show_icon: false
    show_state: false
    triggers_update:
      - sensor.family_defcon_last_event
      - binary_sensor.family_defcon_dashboard_target_confirmed
      - text.family_defcon_dashboard_pin
      - select.family_defcon_dashboard_target
    tap_action:
      action: none
    styles:
      name:
        - display: none
      card:
        - border-radius: 18px
        - padding: 10px
        - min-height: 76px
        - background: |
            [[[
              const pin = states['text.family_defcon_dashboard_pin']?.state || '';
              const confirmed = states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
              const event = states['sensor.family_defcon_last_event']?.state || '';
              const lower = event.toLowerCase();

              if (confirmed) return 'linear-gradient(135deg, #003b12, #69f0ae)';
              if (lower.includes('invalid pin') || lower.includes('bad pin') || lower.includes('locked') || lower.includes('rejected')) return 'linear-gradient(135deg, #4a0000, #ff8a80)';
              if (lower.includes('launch sent')) return 'linear-gradient(135deg, #0b365c, #29b6f6)';
              if (pin.length > 0) return 'linear-gradient(135deg, #4a3b00, #fdd835)';
              return '#101820';
            ]]]
        - color: |
            [[[
              const pin = states['text.family_defcon_dashboard_pin']?.state || '';
              const confirmed = states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
              const event = states['sensor.family_defcon_last_event']?.state || '';
              const lower = event.toLowerCase();
              return confirmed || pin.length > 0 || lower.includes('invalid pin') || lower.includes('bad pin') || lower.includes('locked') || lower.includes('rejected') || lower.includes('launch sent') ? '#111111' : '#ffffff';
            ]]]
        - border: 1px solid rgba(255,255,255,.12)
    custom_fields:
      status: |
        [[[
          const pin = states['text.family_defcon_dashboard_pin']?.state || '';
          const target = states['select.family_defcon_dashboard_target']?.state || 'No target';
          const confirmed = states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
          const event = states['sensor.family_defcon_last_event']?.state || '';
          const lower = event.toLowerCase();

          if (confirmed) return `<div style="text-align:center;"><div style="font-size:12px;font-weight:950;letter-spacing:1px;">✅ TARGET LOCKED</div><div style="font-size:24px;font-weight:950;margin-top:2px;">${target}</div><div style="font-size:11px;margin-top:2px;">${event}</div></div>`;

          if (lower.includes('invalid pin') || lower.includes('bad pin') || lower.includes('locked') || lower.includes('rejected')) return `<div style="text-align:center;"><div style="font-size:12px;font-weight:950;letter-spacing:1px;">❌ PIN NOT VALID</div><div style="font-size:17px;font-weight:950;margin-top:2px;">${event}</div><div style="font-size:11px;margin-top:2px;">Clear or re-enter PIN.</div></div>`;

          if (lower.includes('launch sent')) return `<div style="text-align:center;"><div style="font-size:12px;font-weight:950;letter-spacing:1px;">🚀 LAUNCHING</div><div style="font-size:17px;font-weight:950;margin-top:2px;">${event}</div></div>`;

          if (pin.length > 0) return `<div style="text-align:center;"><div style="font-size:12px;font-weight:900;letter-spacing:1px;">TARGET READY</div><div style="font-size:24px;font-weight:950;margin-top:2px;">${target}</div><div style="font-size:11px;margin-top:2px;">Press CONFIRM to validate PIN and lock target.</div></div>`;

          return `<div style="text-align:center;"><div style="font-size:12px;font-weight:900;letter-spacing:1px;color:#b0bec5;">AWAITING PIN</div><div style="font-size:20px;font-weight:950;margin-top:2px;">Select target and enter PIN</div></div>`;
        ]]]

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        entity: button.family_defcon_dashboard_confirm_targeting
        name: CONFIRM
        icon: mdi:target
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.family_defcon_dashboard_confirm_targeting
        styles:
          card:
            - height: 58px
            - border-radius: 18px
            - background: |
                [[[
                  const confirmed = states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
                  const pin = states['text.family_defcon_dashboard_pin']?.state || '';
                  const event = states['sensor.family_defcon_last_event']?.state || '';
                  const lower = event.toLowerCase();

                  if (confirmed) return 'linear-gradient(135deg, #003b12, #69f0ae)';
                  if (lower.includes('invalid pin') || lower.includes('bad pin') || lower.includes('locked') || lower.includes('rejected')) return 'linear-gradient(135deg, #7f0000, #ff8a80)';
                  if (pin.length > 0) return 'linear-gradient(135deg, #fdd835, #fff176)';
                  return '#5f5100';
                ]]]
            - color: "#111"
            - font-weight: 950
          icon:
            - color: "#111"
            - width: 28px
          name:
            - font-size: 14px

      - type: custom:button-card
        entity: button.family_defcon_dashboard_launch
        name: LAUNCH
        icon: mdi:rocket-launch
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.family_defcon_dashboard_launch
        styles:
          card:
            - height: 58px
            - border-radius: 18px
            - background: |
                [[[
                  const confirmed = states['binary_sensor.family_defcon_dashboard_target_confirmed']?.state === 'on';
                  const event = states['sensor.family_defcon_last_event']?.state || '';
                  if (event.toLowerCase().includes('launch sent')) return 'linear-gradient(135deg, #0b365c, #29b6f6)';
                  if (confirmed) return 'linear-gradient(135deg, #b71c1c, #f44336)';
                  return '#4b1b1b';
                ]]]
            - color: white
            - font-weight: 950
          icon:
            - width: 28px
          name:
            - font-size: 14px

      - type: custom:button-card
        entity: button.family_defcon_dashboard_cancel
        name: CANCEL
        icon: mdi:cancel
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.family_defcon_dashboard_cancel
        styles:
          card:
            - height: 58px
            - border-radius: 18px
            - background: "#263238"
            - color: white
            - font-weight: 950
          icon:
            - width: 28px
            - color: "#cfd8dc"
          name:
            - font-size: 14px

  - type: custom:button-card
    name: SELECT TARGET
    icon: mdi:crosshairs-gps
    show_icon: true
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 18px
        - padding: 8px 12px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(41,182,246,.38)
        - min-height: 40px
      name:
        - justify-self: start
        - color: "#29b6f6"
        - font-size: 14px
        - font-weight: 900
      icon:
        - color: "#29b6f6"
        - width: 22px

  - type: custom:auto-entities
    show_empty: false
    card:
      type: grid
      columns: 3
      square: false
    card_param: cards
    filter:
      include:
        - entity_id: button.family_defcon_select_target_*
          options:
            type: custom:button-card
            entity: this.entity_id
            show_state: false
            name: |
              [[[ return entity.attributes.target || entity.attributes.friendly_name || 'Target'; ]]]
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: this.entity_id
            triggers_update:
              - select.family_defcon_dashboard_target
            styles:
              card:
                - height: 48px
                - border-radius: 14px
                - background: |
                    [[[
                      const selected = states['select.family_defcon_dashboard_target']?.state || '';
                      const name = entity.attributes.target || entity.attributes.friendly_name || '';
                      const parent = entity.attributes.is_parent_target === true || ['parent', 'adult', 'guardian'].some(x => name.toLowerCase().includes(x));
                      if (selected === name && parent) return 'linear-gradient(135deg, #fdd835, #f9a825)';
                      if (selected === name) return 'linear-gradient(135deg, #29b6f6, #1565c0)';
                      return '#101820';
                    ]]]
                - color: |
                    [[[
                      const selected = states['select.family_defcon_dashboard_target']?.state || '';
                      const name = entity.attributes.target || entity.attributes.friendly_name || '';
                      const parent = entity.attributes.is_parent_target === true || ['parent', 'adult', 'guardian'].some(x => name.toLowerCase().includes(x));
                      return selected === name && parent ? '#111111' : '#ffffff';
                    ]]]
                - border: 1px solid rgba(255,255,255,.12)
              icon:
                - width: 20px
              name:
                - font-size: 13px
                - font-weight: 950
      sort:
        method: name

  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:button-card
        name: "1"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "1"
        styles: &keypad_style
          card:
            - height: 46px
            - border-radius: 14px
            - background: "#101820"
            - color: white
            - font-weight: 950
            - border: 1px solid rgba(255,255,255,.12)
          name:
            - font-size: 20px
            - font-weight: 950
      - type: custom:button-card
        name: "2"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "2"
        styles: *keypad_style
      - type: custom:button-card
        name: "3"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "3"
        styles: *keypad_style
      - type: custom:button-card
        name: "4"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "4"
        styles: *keypad_style
      - type: custom:button-card
        name: "5"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "5"
        styles: *keypad_style
      - type: custom:button-card
        name: "6"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "6"
        styles: *keypad_style
      - type: custom:button-card
        name: "7"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "7"
        styles: *keypad_style
      - type: custom:button-card
        name: "8"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "8"
        styles: *keypad_style
      - type: custom:button-card
        name: "9"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "9"
        styles: *keypad_style
      - type: custom:button-card
        name: CLEAR
        tap_action:
          action: call-service
          service: family_defcon.dashboard_clear_pin
        styles:
          card:
            - height: 46px
            - border-radius: 14px
            - background: "#263238"
            - color: white
            - font-weight: 950
            - border: 1px solid rgba(255,255,255,.12)
          name:
            - font-size: 13px
            - font-weight: 950
      - type: custom:button-card
        name: "0"
        tap_action:
          action: call-service
          service: family_defcon.dashboard_keypress
          data:
            digit: "0"
        styles: *keypad_style
      - type: custom:button-card
        name: BACK
        tap_action:
          action: call-service
          service: family_defcon.dashboard_backspace
        styles:
          card:
            - height: 46px
            - border-radius: 14px
            - background: "#263238"
            - color: white
            - font-weight: 950
            - border: 1px solid rgba(255,255,255,.12)
          name:
            - font-size: 13px
            - font-weight: 950
