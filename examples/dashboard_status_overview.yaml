type: vertical-stack
cards:
  - type: custom:button-card
    entity: sensor.family_defcon_level
    name: FAMILY DEFCON
    show_state: false
    show_icon: false
    tap_action:
      action: none
    triggers_update: all
    styles:
      card:
        - padding: clamp(12px, 2vw, 18px)
        - border-radius: 26px
        - border: 1px solid rgba(255,255,255,.16)
        - box-shadow: 0 8px 24px rgba(0,0,0,.35)
        - background: |
            [[[
              const level = Number(states['sensor.family_defcon_level']?.state || 5);
              if (level <= 1) return 'radial-gradient(circle at top left, #ff5252 0%, #3b0000 48%, #090909 100%)';
              if (level <= 2) return 'radial-gradient(circle at top left, #ff7043 0%, #7f0000 48%, #090909 100%)';
              if (level === 3) return 'radial-gradient(circle at top left, #ffb74d 0%, #6d3300 48%, #090909 100%)';
              if (level === 4) return 'radial-gradient(circle at top left, #fff176 0%, #6a5600 48%, #090909 100%)';
              return 'radial-gradient(circle at top left, #69f0ae 0%, #0b4d22 48%, #090909 100%)';
            ]]]
        - color: white
    custom_fields:
      main: |
        [[[
          const level = Number(states['sensor.family_defcon_level']?.state || 5);
          const peace = states['sensor.family_defcon_peace_status']?.state || 'Unknown';
          const event = states['sensor.family_defcon_last_event']?.state || 'System initialized.';
          const armed = states['switch.family_defcon_command_system_armed']?.state === 'on';

          let icon = '🟢';
          let label = 'PEACEFUL STATUS';
          let accent = '#69f0ae';

          if (level <= 1) { icon = '☢️'; label = 'MUTUAL WIFI DESTRUCTION'; accent = '#ff8a80'; }
          else if (level <= 2) { icon = '🚨'; label = 'RED ALERT'; accent = '#ffab91'; }
          else if (level === 3) { icon = '⚠️'; label = 'ESCALATION'; accent = '#ffd180'; }
          else if (level === 4) { icon = '🟡'; label = 'WATCH CONDITION'; accent = '#fff59d'; }

          return `
            <div style="display:grid; grid-template-columns:clamp(58px, 8vw, 90px) minmax(0,1fr); gap:clamp(12px, 2vw, 20px); align-items:center;">
              <div style="font-size:clamp(34px, 5.5vw, 54px); text-align:center;">${icon}</div>
              <div style="min-width:0;">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
                  <div style="font-size:clamp(26px, 4.2vw, 38px); font-weight:950; letter-spacing:2px;">DEFCON ${level}</div>
                  <div style="font-size:12px; font-weight:900; padding:7px 12px; border-radius:999px; background:${armed ? 'rgba(105,240,174,.16)' : 'rgba(255,255,255,.12)'}; color:${armed ? '#69f0ae' : '#cfd8dc'};">
                    ${armed ? 'ARMED' : 'DISARMED'}
                  </div>
                </div>
                <div style="font-size:clamp(14px, 2vw, 17px); font-weight:900; color:${accent}; letter-spacing:1px;">${label}</div>
                <div style="font-size:13px; margin-top:4px; opacity:.9;">Peace Status: <b>${peace}</b></div>
                <div style="font-size:13px; margin-top:4px; opacity:.82; white-space:normal; overflow:visible; line-height:1.35; max-width:100%; word-break:normal;">
                  ${event}
                </div>
              </div>
            </div>
          `;
        ]]]

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.family_defcon_level
        name: DEFCON
        icon: mdi:gauge
        show_state: true
        tap_action:
          action: none
        styles: &status_tile
          card:
            - border-radius: 18px
            - padding: clamp(10px, 1.8vw, 14px)
            - background: "#101820"
            - color: white
            - border: 1px solid rgba(255,255,255,.10)
          icon:
            - color: "#42a5f5"
          state:
            - font-size: clamp(20px, 3vw, 24px)
            - font-weight: 950
          name:
            - font-size: 12px
            - color: "#b0bec5"
            - font-weight: 800
      - type: custom:button-card
        entity: switch.family_defcon_command_system_armed
        name: ARMED STATUS
        icon: mdi:shield-lock
        show_state: true
        tap_action:
          action: none
        styles:
          <<: *status_tile
          icon:
            - color: |
                [[[
                  return entity.state === 'on' ? '#69f0ae' : '#b0bec5';
                ]]]
          state:
            - color: |
                [[[
                  return entity.state === 'on' ? '#69f0ae' : '#b0bec5';
                ]]]
      - type: custom:button-card
        entity: sensor.family_defcon_daily_launches
        name: LAUNCHES
        icon: mdi:target
        show_state: true
        tap_action:
          action: none
        styles:
          <<: *status_tile
          icon:
            - color: "#ffca28"
      - type: custom:button-card
        entity: sensor.family_defcon_conflict_chain
        name: CHAIN
        icon: mdi:link-variant
        show_state: true
        tap_action:
          action: none
        styles:
          <<: *status_tile
          icon:
            - color: "#ef5350"

  - type: custom:button-card
    name: CURRENT WIFI STATUS
    icon: mdi:wifi
    show_icon: true
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 20px
        - padding: 12px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(41,182,246,.38)
      name:
        - justify-self: start
        - color: "#29b6f6"
        - font-size: 18px
        - font-weight: 950
      icon:
        - color: "#29b6f6"
        - width: 28px

  - type: custom:button-card
    entity: sensor.family_defcon_dashboard_people
    show_icon: false
    show_name: false
    tap_action:
      action: none
    triggers_update: all
    styles:
      card:
        - border-radius: 20px
        - padding: 10px
        - background: "#0b1117"
        - color: white
        - border: 1px solid rgba(255,255,255,.12)
    custom_fields:
      people: |
        [[[
          const peopleSensor = states['sensor.family_defcon_dashboard_people'];
          const people = peopleSensor && peopleSensor.attributes && peopleSensor.attributes.people ? peopleSensor.attributes.people : [];

          if (!people.length) {
            return '<div style="padding:14px; color:#ffca28; font-size:16px; text-align:center;">No people configured.</div>';
          }

          return people.map((p) => {
            const status = String(p.status || 'allowed').toLowerCase();
            const minutes = Number(p.minutes_remaining || 0);
            const blocked = p.blocked === true || status === 'blocked' || minutes > 0;

            const color = blocked ? '#ef5350' : '#66bb6a';
            const icon = blocked ? '🚫' : '✅';
            const label = blocked ? (minutes > 0 ? 'PAUSED — ' + minutes + ' min' : 'PAUSED') : 'ALLOWED';

            let role = 'TARGET';
            if (p.is_parent_target) role = 'PARENT';
            if (p.is_default_target) role = 'CHILD';

            return `
              <div style="display:grid; grid-template-columns:42px minmax(0,1fr) 135px; gap:10px; align-items:center; padding:8px 6px; border-bottom:1px solid rgba(255,255,255,.08);">
                <div style="font-size:22px;">${icon}</div>
                <div style="min-width:0;">
                  <div style="font-size:16px; font-weight:900; white-space:normal; overflow:visible;">${p.name}</div>
                  <div style="font-size:10px; opacity:.55; letter-spacing:1px;">${role}</div>
                </div>
                <div style="font-size:13px; font-weight:950; color:${color}; text-align:right; white-space:normal;">${label}</div>
              </div>
            `;
          }).join('');
        ]]]
