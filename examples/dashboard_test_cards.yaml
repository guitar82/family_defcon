type: vertical-stack
cards:
  - type: entities
    title: Family DEFCON
    entities:
      - switch.family_defcon_command_system_armed
      - switch.family_defcon_allow_mom_and_dad_targets
      - binary_sensor.family_defcon_mutual_wifi_destruction
      - sensor.family_defcon_level
      - sensor.family_defcon_peace_status
      - sensor.family_defcon_daily_launches
      - sensor.family_defcon_conflict_chain
      - sensor.family_defcon_last_event
      - sensor.henry_wifi_status
      - sensor.henry_wifi_minutes_remaining
      - sensor.marc_wifi_status
      - sensor.marc_wifi_minutes_remaining
      - sensor.maggie_wifi_status
      - sensor.maggie_wifi_minutes_remaining
  - type: button
    name: Henry launches at Marc
    tap_action:
      action: call-service
      service: family_defcon.launch
      data:
        launcher: Henry
        target: Marc
        station: station_3
  - type: button
    name: Marc launches at Henry
    tap_action:
      action: call-service
      service: family_defcon.launch
      data:
        launcher: Marc
        target: Henry
        station: station_4
  - type: button
    name: Clear All
    tap_action:
      action: call-service
      service: family_defcon.clear_all
