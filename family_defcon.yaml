# Copy this file to /config/family_defcon.yaml
people:
  - Mom
  - Dad
  - Henry
  - Marc
  - Maggie

default_targets:
  - Henry
  - Marc
  - Maggie

parent_targets:
  - Mom
  - Dad

allow_parent_targets_default: false
launches_before_mutual_destruction: 5
chain_before_mutual_destruction: 4
daily_reset_time: "05:00:00"
cooldown_seconds: 30
max_event_log: 25
require_station_match: true
require_key_for_launch: false

penalties:
  first_strike_target_minutes: 30
  retaliator_extra_minutes: 15
  retaliation_target_minutes: 30
  reattacker_extra_minutes: 15
  reattack_target_minutes: 45

stations:
  station_1:
    name: Mom Command
    commander: Mom
    enabled: true
    key_entity: ""
  station_2:
    name: Dad Command
    commander: Dad
    enabled: true
    key_entity: ""
  station_3:
    name: Henry Command
    commander: Henry
    enabled: true
    key_entity: ""
  station_4:
    name: Marc Command
    commander: Marc
    enabled: true
    key_entity: ""
  station_5:
    name: Maggie Command
    commander: Maggie
    enabled: true
    key_entity: ""

dns:
  enabled: false
  provider: custom_services
  enforcement_mode: disabled
  mutual_destruction_scope: default_targets
  custom_services:
    people:
      Henry:
        block:
          action: script.block_henry_internet
        unblock:
          action: script.unblock_henry_internet
      Marc:
        block:
          action: script.block_marc_internet
        unblock:
          action: script.unblock_marc_internet
      Maggie:
        block:
          action: script.block_maggie_internet
        unblock:
          action: script.unblock_maggie_internet
      Mom:
        block:
          action: script.block_mom_internet
        unblock:
          action: script.unblock_mom_internet
      Dad:
        block:
          action: script.block_dad_internet
        unblock:
          action: script.unblock_dad_internet
    groups:
      default_targets:
        block:
          action: script.block_all_kids_internet
        unblock:
          action: script.unblock_all_kids_internet
