people:
  - Mom
  - Dad
  - Henry
  - Marc
  - Maggie

default_targets:
  - Henry
  - Marc
  - Maggie

parent_targets:
  - Mom
  - Dad

allow_parent_targets_default: false

auth:
  mode: pin
  pin_timeout_seconds: 60
  max_bad_pin_attempts: 3
  lockout_seconds_after_bad_pins: 120
  users:
    Mom:
      pin: "1111"
      role: parent
    Dad:
      pin: "2222"
      role: parent
    Henry:
      pin: "3333"
      role: child
    Marc:
      pin: "4444"
      role: child
    Maggie:
      pin: "5555"
      role: child

stations:
  station_1:
    name: Kitchen DEFCON Terminal
    enabled: true
    key_entity: ""
  station_2:
    name: Living Room DEFCON Terminal
    enabled: true
    key_entity: ""
  station_3:
    name: Henry Room DEFCON Terminal
    enabled: true
    key_entity: ""
  station_4:
    name: Marc Room DEFCON Terminal
    enabled: true
    key_entity: ""
  station_5:
    name: Maggie Room DEFCON Terminal
    enabled: true
    key_entity: ""

require_station_match: false
require_key_for_launch: false
cooldown_seconds: 30
launches_before_mutual_destruction: 5
chain_before_mutual_destruction: 4
daily_reset_time: "05:00:00"
max_event_log: 25

penalties:
  first_strike_target_minutes: 30
  retaliator_extra_minutes: 15
  retaliation_target_minutes: 30
  reattacker_extra_minutes: 15
  reattack_target_minutes: 45

dns:
  enabled: true
  provider: custom_services
  enforcement_mode: active
  mutual_destruction_scope: default_targets
  custom_services:
    people:
      Mom:
        block: {action: script.block_mom_internet}
        unblock: {action: script.unblock_mom_internet}
      Dad:
        block: {action: script.block_dad_internet}
        unblock: {action: script.unblock_dad_internet}
      Henry:
        block: {action: script.block_henry_internet}
        unblock: {action: script.unblock_henry_internet}
      Marc:
        block: {action: script.block_marc_internet}
        unblock: {action: script.unblock_marc_internet}
      Maggie:
        block: {action: script.block_maggie_internet}
        unblock: {action: script.unblock_maggie_internet}
    groups:
      default_targets:
        block: {action: script.block_all_kids_internet}
        unblock: {action: script.unblock_all_kids_internet}
      everyone:
        block: {action: script.block_everyone_internet}
        unblock: {action: script.unblock_everyone_internet}
