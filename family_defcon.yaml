# Family DEFCON v0.7
# All variable data lives here.

people:
  - Mom
  - Dad
  - Henry
  - Marc
  - Maggie

default_targets:
  - Henry
  - Marc
  - Maggie

parent_targets:
  - Mom
  - Dad

allow_parent_targets_default: false

auth:
  mode: pin
  pin_timeout_seconds: 60
  max_bad_pin_attempts: 3
  lockout_seconds_after_bad_pins: 120
  users:
    Mom:
      pin: "1111"
      role: parent
    Dad:
      pin: "2222"
      role: parent
    Henry:
      pin: "3333"
      role: child
    Marc:
      pin: "4444"
      role: child
    Maggie:
      pin: "5555"
      role: child

stations:
  station_1:
    name: Kitchen DEFCON Terminal
    enabled: true
    key_entity: ""
  station_2:
    name: Living Room DEFCON Terminal
    enabled: true
    key_entity: ""
  station_3:
    name: Henry Room DEFCON Terminal
    enabled: true
    key_entity: ""
  station_4:
    name: Marc Room DEFCON Terminal
    enabled: true
    key_entity: ""
  station_5:
    name: Maggie Room DEFCON Terminal
    enabled: true
    key_entity: ""

require_station_match: false
require_key_for_launch: false
cooldown_seconds: 30

launches_before_mutual_destruction: 5
chain_before_mutual_destruction: 4
daily_reset_time: "05:00:00"
max_event_log: 25

penalties:
  first_strike_target_minutes: 30
  retaliator_extra_minutes: 15
  retaliation_target_minutes: 30
  reattacker_extra_minutes: 15
  reattack_target_minutes: 45

dns:
  enabled: true
  provider: adguard_home
  enforcement_mode: active
  mutual_destruction_scope: default_targets

  adguard_home:
    base_url: "http://192.168.1.11:3000"

    # Recommended. Keep actual values in secrets.yaml.
    username_secret: adguard_username
    password_secret: adguard_password

    # Optional direct values. Leave blank when using secrets.
    username: ""
    password: ""

    rule_prefix: "Family DEFCON Block"

    # These must match persistent client names in AdGuard Home.
    clients:
      Mom:
        client_name: Mom
        enabled: true
      Dad:
        client_name: Dad
        enabled: true
      Henry:
        client_name: Henry
        enabled: true
      Marc:
        client_name: Marc
        enabled: true
      Maggie:
        client_name: Maggie
        enabled: true
