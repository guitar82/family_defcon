block_everyone_internet:
  alias: Block Everyone Internet
  mode: single
  sequence:
    - action: script.block_mom_internet
    - action: script.block_dad_internet
    - action: script.block_henry_internet
    - action: script.block_marc_internet
    - action: script.block_maggie_internet
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.internet_block_all_kids

unblock_everyone_internet:
  alias: Unblock Everyone Internet
  mode: single
  sequence:
