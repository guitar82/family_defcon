    - action: script.unblock_dad_internet
    - action: script.unblock_henry_internet
    - action: script.unblock_marc_internet
    - action: script.unblock_maggie_internet
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.internet_block_all_kids

clear_family_defcon_blocks:
  alias: Clear Family DEFCON Blocks
  mode: single
  sequence:
    - action: script.unblock_everyone_internet
