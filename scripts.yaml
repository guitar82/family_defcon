block_henry_internet:
  alias: Block Henry Internet
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.internet_block_henry
              state: "off"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.internet_block_henry
            - action: persistent_notification.create
              data:
                title: "Family DEFCON: Henry Blocked"
                message: >
                  {% set event = states('sensor.family_defcon_last_event') %}
                  {% if event in ['unknown', 'unavailable', '', 'All DEFCON timeouts cleared.', 'Config reloaded.'] %}
                    Henry's internet block was manually activated.
                  {% else %}
                    {{ event }}
                  {% endif %}
            - action: rest_command.adguard_block_henry

unblock_henry_internet:
  alias: Unblock Henry Internet
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.internet_block_henry
              state: "on"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.internet_block_henry
            - action: persistent_notification.create
              data:
                title: "Family DEFCON: Henry Restored"
                message: "Henry's WiFi timeout has ended."
            - action: rest_command.adguard_unblock_henry

