adguard_block_mom:
  url: "http://192.168.1.11:3000/control/filtering/add_url"
  method: post
  username: !secret adguard_username
  password: !secret adguard_password
  authentication: basic
  content_type: "application/json"
  payload: >
    {"name":"Family DEFCON Block Mom","url":"data:text/plain,||*^$client='Mom'"}

adguard_unblock_mom:
  url: "http://192.168.1.11:3000/control/filtering/remove_url"
  method: post
  username: !secret adguard_username
  password: !secret adguard_password
  authentication: basic
  content_type: "application/json"
  payload: >
    {"url":"data:text/plain,||*^$client='Mom'"}

